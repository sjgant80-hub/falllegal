<style>
:root{
 --void:#0b0a0f;--void-2:#13121a;--ink:#1a1922;--ink-2:#22212c;
 --line:#2a2934;--line-soft:#1f1e28;
 --cream:#e6e1d6;--cream-dim:#a8a395;--cream-muted:#6e6a5e;
 --brass:#b8974a;--amber:#ff8c00;--ox:#8b1a1a;
 --green:#4ade80;--red:#ef4444;--blue:#60a5fa;--yellow:#fbbf24;
 --serif:'Libre Baskerville',Georgia,ui-serif,serif;
 --sans:'DM Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--void);color:var(--cream);font:14px/1.55 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle at 1px 1px,rgba(184,151,74,0.03) 1px,transparent 0);background-size:3px 3px;z-index:0}
button{font-family:inherit;cursor:pointer;background:transparent;border:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--ink);border:1px solid var(--line);color:var(--cream);border-radius:3px;padding:7px 10px;outline:none;font-size:13px}
input:focus,textarea:focus,select:focus{border-color:var(--brass)}
input[type=number]{font-family:var(--mono)}
a{color:var(--brass);cursor:pointer}a:hover{color:var(--amber)}

.app{min-height:100dvh;display:grid;grid-template-rows:48px 1fr;position:relative;z-index:1}
header{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--void-2);user-select:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;border-right:1px solid var(--line)}
.brand .mark{width:28px;height:28px;background:linear-gradient(135deg,var(--ox),var(--brass));border-radius:5px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--cream)}
.brand .name{font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:0.02em}
.brand .seal{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.18em;text-transform:uppercase}

.matter-pill{display:flex;align-items:center;gap:8px;padding:0 14px;height:100%;border-right:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--cream-dim);min-width:0}
.matter-pill:hover{background:var(--ink);color:var(--cream)}
.matter-pill .who{font-family:var(--serif);font-size:13px;color:var(--brass);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.matter-pill .meta{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase}

nav.tabs{display:flex;flex:1;overflow-x:auto;align-items:stretch}
nav.tabs button{padding:0 14px;font-size:12px;color:var(--cream-dim);letter-spacing:0.04em;display:flex;align-items:center;gap:6px;border-right:1px solid var(--line-soft);height:100%;white-space:nowrap;border-top:2px solid transparent}
nav.tabs button:hover{background:var(--ink);color:var(--cream)}
nav.tabs button.active{background:var(--ink);color:var(--brass);border-top-color:var(--brass)}

.tools-r{display:flex;align-items:center;gap:5px;padding:0 14px;height:100%;border-left:1px solid var(--line)}
.tool-btn{padding:5px 11px;border-radius:3px;font-size:11px;color:var(--cream-dim);letter-spacing:0.06em;text-transform:uppercase;font-family:var(--mono);border:1px solid var(--line)}
.tool-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--brass)}
.tool-btn.primary{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}
.tool-btn.primary:hover{background:var(--amber);border-color:var(--amber)}
.tool-btn.t3{border-color:var(--blue);color:var(--blue)}

.menu-toggle{display:none;padding:0 14px;height:100%;border-right:1px solid var(--line);font-size:20px;color:var(--brass)}

.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100dvh - 48px)}
aside.sidebar{background:var(--void-2);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 60px;display:flex;flex-direction:column;gap:10px}
.sidebar h4{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:6px;padding:0 4px}
.sidebar-search{display:flex;flex-direction:column;gap:6px}
.sidebar-search input,.sidebar-search select{font-size:12px;padding:6px 8px}
.matter-list{display:flex;flex-direction:column;gap:3px}
.matter-card{padding:9px 11px;border-radius:3px;cursor:pointer;border:1px solid transparent;border-left:3px solid var(--line);background:var(--ink);transition:all 0.1s}
.matter-card:hover{background:var(--ink-2);border-left-color:var(--brass)}
.matter-card.active{background:var(--ink-2);border-left-color:var(--brass);border-color:var(--line)}
.matter-card .nm{font-family:var(--serif);font-size:13px;color:var(--cream);font-weight:600;line-height:1.3}
.matter-card .ref{font-family:var(--mono);font-size:9px;color:var(--brass);letter-spacing:0.08em;margin-bottom:2px}
.matter-card .sub{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.06em;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.matter-card .sub .tag{padding:1px 5px;border-radius:2px;background:var(--void);color:var(--cream-dim);font-size:9px}
.matter-card .sub .tag.due-7{background:var(--amber);color:var(--void);font-weight:700}
.matter-card .sub .tag.due-14{background:var(--yellow);color:var(--void)}
.matter-card .sub .tag.due-28{background:var(--brass);color:var(--void)}
.matter-card .sub .tag.due-now{background:var(--ox);color:var(--cream);font-weight:700}
.matter-card .sub .tag.risk-h{background:var(--ox);color:var(--cream)}
.matter-card .sub .tag.risk-e{background:var(--amber);color:var(--void)}
.matter-card .sub .tag.area{color:var(--brass);border:1px solid var(--line)}
.empty-state{padding:18px;text-align:center;color:var(--cream-muted);font-size:12px;font-style:italic}

main{padding:18px 22px 60px;overflow-y:auto;max-width:1280px;margin:0 auto;width:100%}

.disclaimer{background:rgba(139,26,26,0.15);border:1px solid var(--ox);border-left:3px solid var(--ox);border-radius:3px;padding:12px 16px;margin-bottom:18px;font-size:12px;color:var(--cream)}
.disclaimer strong{color:var(--brass)}

.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:14px;flex-wrap:wrap}
.section-h h2{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:0.01em}
.section-h .sub{font-family:var(--mono);font-size:11px;color:var(--cream-muted);letter-spacing:0.08em;text-transform:uppercase}
.section-h .actions{display:flex;gap:6px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid.g2{grid-template-columns:1fr 1fr}
.card{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.card h3{font-family:var(--serif);font-size:14px;font-weight:600;margin-bottom:10px;color:var(--cream);letter-spacing:0.01em}
.card h3 .meta{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.1em;margin-left:8px}

.kpi{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}

.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row.r3{grid-template-columns:1fr 1fr 1fr}
.row.r4{grid-template-columns:1fr 1fr 1fr 1fr}
.field label{display:block;font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%}
.field .hint{font-size:10px;color:var(--cream-muted);margin-top:3px;font-family:var(--mono)}
.field textarea{min-height:64px;font-family:var(--sans);resize:vertical}

.btn{padding:7px 14px;border:1px solid var(--brass);border-radius:3px;font-size:12px;color:var(--cream);background:transparent;letter-spacing:0.04em;cursor:pointer}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.primary{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}
.btn.primary:hover{background:var(--amber);border-color:var(--amber)}
.btn.ox{border-color:var(--ox);color:var(--ox)}
.btn.ox:hover{background:var(--ox);color:var(--cream)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.ghost{border-color:var(--line);color:var(--cream-dim)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass)}

.matter-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.matter-tabs button{padding:9px 16px;font-size:12px;color:var(--cream-dim);border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--mono);letter-spacing:0.06em;text-transform:uppercase}

.modal{position:fixed;inset:0;background:rgba(11,10,15,0.78);display:none;align-items:center;justify-content:center;z-index:150;padding:20px}

.weave{border:1px solid var(--line);background:var(--void);border-radius:4px;padding:14px;margin-bottom:10px}

.chat-msg .role{font-family:var(--mono);font-size:9px;color:var(--brass);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:4px}

.t0chip:hover{border-color:var(--brass);color:var(--brass)}

.adv-issue{padding:12px;border:1px solid var(--line);background:var(--void);border-radius:3px;margin-bottom:10px}
.adv-issue .hd{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.08em;margin-bottom:6px}
.adv-issue .body{font-size:13px;color:var(--cream);white-space:pre-wrap}
.adv-issue .sig{font-family:var(--mono);font-size:9px;color:var(--cream-muted);margin-top:8px;word-break:break-all}

.crit-banner{padding:9px 14px;background:rgba(255,140,0,0.15);border:1px solid var(--amber);border-radius:3px;color:var(--amber);font-size:12px;margin-bottom:10px;font-family:var(--mono);letter-spacing:0.04em}
.crit-banner.red{background:rgba(239,68,68,0.15);border-color:var(--red);color:var(--red)}

.tag-area{display:inline-block;padding:2px 7px;border-radius:2px;background:var(--void);border:1px solid var(--brass);color:var(--brass);font-family:var(--mono);font-size:10px;letter-spacing:0.05em;text-transform:uppercase}

.no-active{padding:40px 20px;text-align:center;color:var(--cream-muted)}
.no-active h3{font-family:var(--serif);font-size:18px;color:var(--brass);margin-bottom:8px}

@media(max-width:880px){
 .menu-toggle{display:flex;align-items:center}
 .layout{grid-template-columns:1fr}
 aside.sidebar{position:fixed;top:48px;left:0;bottom:0;width:88%;max-width:340px;z-index:120;transform:translateX(-100%);transition:transform 0.2s}
 aside.sidebar.open{transform:translateX(0)}
 main{padding:14px}
 .matter-pill{display:none}
 nav.tabs button{padding:0 10px;font-size:11px}
 .brand .seal{display:none}
 .tool-btn{padding:4px 8px;font-size:10px}
 .row,.row.r3,.row.r4{grid-template-columns:1fr}
 .grid.g2{grid-template-columns:1fr}
}

  const STT_PROVIDERS = {

  // ─── State ──────────────────────────────────────────────────────────
  const MODALITIES = ['text', 'image', 'video', 'tts', 'stt'];
  const emptyKeys = () => ({ text: {}, image: {}, video: {}, tts: {}, stt: {} });
  /**
   * What a stored config holds, split into what may be stored (the tier, providers, models) and what is held in this
   * tab only (the keys). Keys stay stored only when the owner chose "remember my keys on this device"; a config written
   * the old way (keys stored, no choice made) has its keys moved into the tab and stored no longer. Pure.
   * → { config, secrets, moved } (moved: how many keys were taken out of storage)
   */
  function configFrom(c) {
    c = c && typeof c === 'object' && !Array.isArray(c) ? Object.assign({}, c) : {};
    if (c.api_key && !c.keys) {   // v1 → v2: one text key at the top level
      c.keys = emptyKeys();
      c.keys.text[c.api_provider || 'anthropic'] = { key: c.api_key, model: c.api_model };
    }
    delete c.api_key;
    const secrets = emptyKeys(), models = emptyKeys();
    let moved = 0;
    for (const m of MODALITIES) {
      const held = c.keys && c.keys[m] && typeof c.keys[m] === 'object' ? c.keys[m] : {};
      for (const pk of Object.keys(held)) {
        const e = held[pk] || {};
        if (typeof e.key === 'string' && e.key) { secrets[m][pk] = e.key; moved++; }
        if (typeof e.model === 'string' && e.model) models[m][pk] = e.model;
      }
      const kept = c.models && c.models[m] && typeof c.models[m] === 'object' ? c.models[m] : {};
      for (const pk of Object.keys(kept)) if (typeof kept[pk] === 'string' && kept[pk]) models[m][pk] = models[m][pk] || kept[pk];
    }
    c.models = models;
    const remember = c.remember_keys === true;
    if (!remember) delete c.keys;
    return { config: c, secrets: secrets, moved: remember ? 0 : moved };
  }
  /** what is written to storage: the config, with the keys only if the owner chose to remember them. Pure. */
  function storedForm(config, secrets) {
    const out = Object.assign({}, config);
    delete out.keys;
    if (config.remember_keys === true) {
      out.keys = emptyKeys();
      for (const m of MODALITIES) for (const pk of Object.keys(secrets[m] || {})) out.keys[m][pk] = { key: secrets[m][pk], model: (config.models && config.models[m] && config.models[m][pk]) || undefined };
    }
    return out;
  }
  const BOOT = (function () {
    let stored = {};
    try { stored = JSON.parse(localStorage.getItem('fall-kit.config') || '{}'); } catch (e) { stored = {}; }
    return configFrom(stored);
  })();
  const STATE = {
    config: BOOT.config,
    secrets: BOOT.secrets,   // the keys: this tab only, unless remember_keys
    ai: { ready: false, loading: false, progress: 0, engine: null, model: null },
    mesh: { active: false, peers: new Map(), bc: null, signal: null },
    lastUsage: null,
    ask: { opening: null, talk: [], last: null },   // the talk about this page: its opening, kept identical, and its turns
  };

  function saveConfig() { try { localStorage.setItem('fall-kit.config', JSON.stringify(storedForm(STATE.config, STATE.secrets))); } catch (e) {} }
  if (BOOT.moved) saveConfig();   // keys stored the old way leave shared storage now; they stay usable in this tab
  function getKey(modality, providerKey) { return (STATE.secrets[modality] && STATE.secrets[modality][providerKey]) || ''; }
  function getModel(modality, providerKey, registry) {
    return (STATE.config.models && STATE.config.models[modality] && STATE.config.models[modality][providerKey]) || registry[providerKey]?.default;
  }
  function setKey(modality, providerKey, key, model) {
    STATE.secrets[modality] = STATE.secrets[modality] || {};
    if (key) STATE.secrets[modality][providerKey] = key;
    STATE.config.models = STATE.config.models || emptyKeys();
    STATE.config.models[modality] = STATE.config.models[modality] || {};
    if (model) STATE.config.models[modality][providerKey] = model;
    saveConfig();
  }
  function forgetKeys() { STATE.secrets = emptyKeys(); STATE.config.remember_keys = false; saveConfig(); renderAiChip(); }

  // ─── DOM helpers ────────────────────────────────────────────────────
  function $(s, root) { return (root || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  // ─── AI tier ────────────────────────────────────────────────────────
  function aiTier() { return STATE.config.ai_tier || 'T0'; }
  function activeTextProvider() { return STATE.config.text_provider || 'anthropic'; }

  function renderAiChip() {
    const chip = $('#fk-ai-chip');
    if (!chip) return;
    const txt = $('#fk-ai-chip-text');
    chip.classList.remove('fk-chip-live', 'fk-chip-loading', 'fk-chip-warn');
    const tier = aiTier();
    if (tier === 'T0') { txt.textContent = 'T0 · off'; }
    else if (tier === 'T2') {
      if (STATE.ai.ready) { txt.textContent = 'T2 ' + (WEBLLM_MODELS[STATE.config.webllm_model || DEFAULT_MODEL]?.label.split(' · ')[0] || '') + ' · ready'; chip.classList.add('fk-chip-live'); }
      else if (STATE.ai.loading) { txt.textContent = 'T2 loading ' + Math.round(STATE.ai.progress) + '%'; chip.classList.add('fk-chip-loading'); }
      else { txt.textContent = 'T2 · click to load'; chip.classList.add('fk-chip-warn'); }
    } else if (tier === 'T3') {
      const p = activeTextProvider();
      if (getKey('text', p)) { txt.textContent = 'T3 ' + (TEXT_PROVIDERS[p]?.label.split(' ')[0] || 'BYOK') + ' · active'; chip.classList.add('fk-chip-live'); }
      else { txt.textContent = 'T3 · no key set'; chip.classList.add('fk-chip-warn'); }
    }
  }

  async function loadWebLLM(modelKey) {
    if (STATE.ai.loading) return;
    const key = modelKey || STATE.config.webllm_model || DEFAULT_MODEL;
    const model = WEBLLM_MODELS[key];
    if (!model) { console.error('fall-kit: unknown model', key); return; }
    if (STATE.ai.ready && STATE.ai.model === model.id) return;
    STATE.ai.loading = true; STATE.ai.progress = 0; renderAiChip();
    notify('Loading WebLLM · ' + model.label + ' · ' + model.size + ' first time', 'info');
    try {
      const { CreateMLCEngine } = await import('https://esm.run/@mlc-ai/web-llm@0.2.79');
      const engine = await CreateMLCEngine(model.id, {
        initProgressCallback: p => { STATE.ai.progress = (p.progress || 0) * 100; renderAiChip(); }
      });
      STATE.ai.engine = engine; STATE.ai.model = model.id; STATE.ai.ready = true; STATE.ai.loading = false;
      STATE.config.webllm_model = key; saveConfig(); renderAiChip();
      notify('WebLLM ready · sovereign mode · ' + model.label.split(' · ')[0], 'ok');
    } catch (e) {
      console.error('fall-kit: WebLLM load failed', e);
      STATE.ai.loading = false; renderAiChip();
      notify('WebLLM load failed · ' + e.message, 'err');
    }
  }

  // ═══════════════════════ TEXT · aiComplete · aiChat ═══════════════
  // One way to ask every text provider: the system prompt first and the same each call (so a provider can reuse its
  // reading of it), then the conversation, which only ever grows. Pure pieces (requestOf, textOf, usageOf) are exposed
  // on FallKit for tests; nothing pure here touches the network.
  const isObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
  const count = (x) => (Number.isInteger(x) && x >= 0 ? x : 0);
  /** Claude models from 5.x think before they answer: room for that, and a light effort for an assistant's reply */
  const THINKS = (model) => /^claude-(?:opus|sonnet|haiku|fable|mythos)-5/.test(model);
  /** Claude models with a server-side fallback when a request is declined (Haiku has none) */
  const FALLS_BACK = (model) => /^claude-(?:opus|sonnet|fable)-5/.test(model);
  /** a message's words, whatever shape a provider keeps it in */
  function wordsOf(m) {
    if (!isObj(m)) return '';
    if (typeof m.content === 'string') return m.content;
    if (Array.isArray(m.content)) return m.content.filter((b) => isObj(b) && b.type === 'text' && typeof b.text === 'string').map((b) => b.text).join('\n');
    return '';
  }
  /**
   * The request a text provider is sent: { url, headers, body } for type (anthropic | openai | google | openai_compat |
   * cohere | hf_inference). messages: [{ role: 'user' | 'assistant', content }]. Pure: the key is placed, never kept.
   */
  function requestOf(type, opts) {
    const { model, key, system, messages, maxTokens, url } = opts;
    const max = Number.isInteger(maxTokens) && maxTokens > 0 ? maxTokens : 600;
    const plain = messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: wordsOf(m) }));
    if (type === 'anthropic') {
      const headers = { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      const body = { model, max_tokens: THINKS(model) ? Math.max(max * 4, 4000) : max, system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
        messages: messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })) };
      if (THINKS(model)) body.output_config = { effort: 'low' };
      if (FALLS_BACK(model)) { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
      return { url: 'https://api.anthropic.com/v1/messages', headers, body };
    }
    if (type === 'openai') return { url: 'https://api.openai.com/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_completion_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'google') return { url: 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
      body: { systemInstruction: { parts: [{ text: system }] }, contents: plain.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), generationConfig: { maxOutputTokens: max } } };
    if (type === 'cohere') return { url: 'https://api.cohere.com/v2/chat', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'hf_inference') return { url: 'https://api-inference.huggingface.co/models/' + model + '/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'openai_compat') return { url: url, headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    return null;
  }
  /** the answer's words from a provider's reply, or null when it declined or said nothing. Pure. */
  function textOf(type, j) {
    if (!isObj(j)) return null;
    let t = '';
    if (type === 'anthropic') { if (j.stop_reason === 'refusal' || !Array.isArray(j.content)) return null; t = wordsOf({ content: j.content }); }
    else if (type === 'google') { const c = Array.isArray(j.candidates) ? j.candidates[0] : null; t = c && isObj(c.content) && Array.isArray(c.content.parts) ? c.content.parts.map((p) => (isObj(p) && typeof p.text === 'string' ? p.text : '')).join('') : ''; }
    else if (type === 'cohere') { t = isObj(j.message) && Array.isArray(j.message.content) ? wordsOf({ content: j.message.content.map((b) => Object.assign({ type: 'text' }, b)) }) : ''; }
    else { const c = Array.isArray(j.choices) ? j.choices[0] : null; t = c && isObj(c.message) && typeof c.message.content === 'string' ? c.message.content : ''; }
    t = t.trim();
    return t ? t : null;
  }
  /** what a call used, read from a provider's own usage record: { read, recycled, written, out }. Pure. */
  function usageOf(type, j) {
    const u = isObj(j) ? (type === 'google' ? j.usageMetadata : type === 'cohere' && isObj(j.usage) ? j.usage.tokens : j.usage) : null;
    if (!isObj(u)) return { read: 0, recycled: 0, written: 0, out: 0 };
    if (type === 'anthropic') { const recycled = count(u.cache_read_input_tokens), written = count(u.cache_creation_input_tokens); return { read: count(u.input_tokens) + recycled + written, recycled, written, out: count(u.output_tokens) }; }
    if (type === 'google') { const read = count(u.promptTokenCount); return { read, recycled: Math.min(read, count(u.cachedContentTokenCount)), written: 0, out: count(u.candidatesTokenCount) + count(u.thoughtsTokenCount) }; }
    if (type === 'cohere') return { read: count(u.input_tokens), recycled: 0, written: 0, out: count(u.output_tokens) };
    const read = count(u.prompt_tokens), d = isObj(u.prompt_tokens_details) ? u.prompt_tokens_details : {};
    return { read, recycled: Math.min(read, count(d.cached_tokens)), written: 0, out: count(u.completion_tokens) };
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    const r = await aiChat(systemPrompt, [], userMsg, maxTokens);
    return r ? r.text : null;
  }
  /**
   * One turn of a conversation: the system prompt, the history so far (unchanged), and the user's words. → { text,
   * assistant } — the caller appends { role: 'user', content: userMsg } and `assistant` to its history (assistant is the
   * reply as the provider gave it, so a provider that checks its own earlier turns sees them unchanged) — or null when no
   * tier can answer.
   */
  async function aiChat(systemPrompt, history, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const messages = (Array.isArray(history) ? history : []).concat([{ role: 'user', content: String(userMsg == null ? '' : userMsg) }]);
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }].concat(messages.map((m) => ({ role: m.role, content: wordsOf(m) }))), max_tokens: maxTokens,
      });
      const text = r.choices[0].message.content;
      STATE.lastUsage = Object.assign({ provider: 'webllm' }, usageOf('openai', r));
      return { text: text, assistant: { role: 'assistant', content: text } };
    }
    if (tier === 'T3') {
      const p = activeTextProvider(); const key = getKey('text', p);
      if (!key) return null;
      return await textCall(p, systemPrompt, messages, maxTokens);
    }
    return null;
  }

  async function textCall(providerKey, sys, messages, maxTokens) {
    const p = TEXT_PROVIDERS[providerKey];
    const model = getModel('text', providerKey, TEXT_PROVIDERS);
    const req = requestOf(p.type, { model, key: getKey('text', providerKey), system: sys, messages, maxTokens, url: p.url });
    if (!req) throw new Error('unknown text provider type: ' + p.type);
    const r = await fetch(req.url, { method: 'POST', headers: req.headers, body: JSON.stringify(req.body) });
    if (!r.ok) throw new Error(p.label + ' ' + r.status);
    const j = await r.json();
    STATE.lastUsage = Object.assign({ provider: providerKey, model: model }, usageOf(p.type, j));
    const text = textOf(p.type, j);
    if (text === null) return null;
    return { text: text, assistant: p.type === 'anthropic' ? { role: 'assistant', content: j.content } : { role: 'assistant', content: text } };
  }

  // ═══════════════════════ ASK · about this page ═════════════════════
  // The kit's own use of the brain, so the chip is useful in any build, wired or not: a question about the page, answered
  // from the page's own words. The opening is read once per talk and sent byte-identical every question, so a provider
  // that caches recycles it; a talk starts afresh after MAX_ASKS questions or when the person starts again.
  const PAGE_MAX = 12000, MAX_ASKS = 20;
  const ASK_OPENING = 'You are the helper inside a web page. Answer questions about this page and how to use it, briefly and in plain words. Use only what the page says below; when it does not say, say so.';
  /** the opening for questions about a page: who the helper is, then the page's title, description and text. Pure. */
  function pageOpening(page) {
    const p = isObj(page) ? page : {};
    const line = (s, n) => (typeof s === 'string' ? s : '').replace(/\s+/g, ' ').trim().slice(0, n);
    const text = (typeof p.text === 'string' ? p.text : '').replace(/[ \t\r\f\v]+/g, ' ').replace(/ *\n[\s]*/g, '\n').trim().slice(0, PAGE_MAX);
    const about = line(p.description, 400);
    return ASK_OPENING + '\n\nPAGE: ' + (line(p.title, 200) || '(no title)') + '\n' + (about ? 'ABOUT: ' + about + '\n' : '') + 'TEXT:\n' + text;
  }
  function readPage() {   // the page as its reader has it, without the kit's own chip, panel and code
    const d = document.querySelector('meta[name="description"]');
    const body = document.body ? document.body.cloneNode(true) : null;
    if (body) {
      body.querySelectorAll('#fk-modal-bg, #fk-ai-chip, #fk-toast, script, style, noscript, template').forEach((e) => e.remove());
      body.querySelectorAll('td, th').forEach((e) => e.append(' | '));   // keep cells and blocks apart, as a reader sees them
      body.querySelectorAll('p, div, li, tr, h1, h2, h3, h4, h5, h6, br, pre, dt, dd, figcaption, blockquote, section, article, header, footer, nav, label, button, option').forEach((e) => e.append('\n'));
    }
    return { title: document.title, description: d ? d.getAttribute('content') : '', text: body ? body.textContent : '' };
  }
  async function askPage(question) {
    const q = String(question == null ? '' : question).trim();
    if (!q) return { text: null, why: 'Type a question first.' };
    if (aiTier() === 'T0') return { text: null, why: 'AI is off. Pick T2 (a model in your browser) or T3 (your own key) below, press Save, then ask.' };
    const t = STATE.ask;
    if (!t.opening || t.talk.length >= MAX_ASKS * 2) { t.opening = pageOpening(readPage()); t.talk = []; }
    const r = await aiChat(t.opening, t.talk, q, 600);
    if (!r) return { text: null, why: aiTier() === 'T2' ? 'The in-browser model is not loaded yet: press Load model below.' : 'No key is set for this provider: add one below and press Save.' };
    t.talk.push({ role: 'user', content: q }, r.assistant);
    t.last = r.text;
    return { text: r.text, why: null };

  // ═══════════════════════ STT · aiSTT ═══════════════════════════════
  async function aiSTT(blob, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.stt_provider || 'deepgram';
    const p = STT_PROVIDERS[providerKey];
    const key = getKey('stt', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('stt', providerKey, STT_PROVIDERS);

    if (p.type === 'deepgram') {
      const r = await fetch('https://api.deepgram.com/v1/listen?model=' + model + '&smart_format=true', {
        method: 'POST', headers: { 'Authorization': 'Token ' + key, 'content-type': blob.type || 'audio/wav' },
        body: blob,
      });
      if (!r.ok) throw new Error('Deepgram ' + r.status);
      const j = await r.json();
      return { text: j.results?.channels?.[0]?.alternatives?.[0]?.transcript, raw: j };
    }
    if (p.type === 'assemblyai') {
      const up = await fetch('https://api.assemblyai.com/v2/upload', { method: 'POST', headers: { 'Authorization': key }, body: blob });
      const upJ = await up.json();
      const r = await fetch('https://api.assemblyai.com/v2/transcript', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': key },
        body: JSON.stringify({ audio_url: upJ.upload_url, speech_model: model }),
      });
      if (!r.ok) throw new Error('AssemblyAI ' + r.status);
      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll for text' };
    }
    if (p.type === 'openai_stt') {
      const fd = new FormData();
      fd.append('file', blob, 'audio.wav');
      fd.append('model', model);
      const r = await fetch('https://api.openai.com/v1/audio/transcriptions', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + key }, body: fd,
      });
      if (!r.ok) throw new Error('OpenAI Whisper ' + r.status);
      const j = await r.json();
      return { text: j.text, raw: j };
    }
    throw new Error('unknown STT provider type: ' + p.type);
  }

  // ─── WebRTC P2P mesh ────────────────────────────────────────────────
  const MESH_CHANNEL = 'fall-signal';
  function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.bc.onmessage = e => {
      const m = e.data;
      if (!m || !m.kind || m.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(m);
    };
    STATE.mesh.bc.postMessage({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    STATE.mesh.active = true;
    notify('Mesh active · channel ' + MESH_CHANNEL, 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    STATE.mesh.bc.postMessage({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }

  // ─── Toast ──────────────────────────────────────────────────────────
  function notify(msg, kind) {
    let t = $('#fk-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'fk-toast';
      t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#c08a3a;color:#0a0a0a;padding:9px 18px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:0;transition:all .22s;z-index:10000;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = kind === 'err' ? '#a14a2a' : kind === 'ok' ? '#6b8d4a' : '#c08a3a';
    t.style.color = kind === 'err' ? '#fff' : '#0a0a0a';
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }

  // A build's bottom tab bar or floating button stays put while the page scrolls, so a chip over it would hide it. The
  // chip looks at what is under it and moves up past it; a fixed container as tall as the page counts only by the
  // control under the chip. Content that scrolls is not in the way.
  function blockerUnder(el) {
    let fixed = null;
    for (let e = el; e && e !== document.body && e !== document.documentElement; e = e.parentElement) {
      const pos = getComputedStyle(e).position;
      if (pos === 'fixed' || pos === 'sticky') { fixed = e; break; }

    if (!fixed) return null;
    if (fixed.getBoundingClientRect().height <= innerHeight * 0.4) return fixed;
    return el.closest('button, a, input, select, textarea, label, [role=button], [tabindex]');

  function placeChip(chip) {

      chip.style.visibility = '';
      if (!hit) return;
      const bottom = innerHeight - hit.getBoundingClientRect().top + 8;
      if (bottom > innerHeight * 0.6) { chip.style.bottom = ''; chip.style.top = '14px'; return; }
      chip.style.bottom = bottom + 'px';
    }
  }

 {id:'W003',name:'The Montgomery Consent',archetype:'Patient not warned of material risk that materialised',agents:['EQUITY','LIBERTY'],move:'Plead failure to warn of "material risk" — patient-centred test, not body of medical opinion.',authorities:['Montgomery v Lanarkshire HB [2015] UKSC 11','Chester v Afshar [2004] UKHL 41','Duce v Worcestershire Acute Hospitals [2018] EWCA Civ 1307'],opposition_move:'Doctor says risk was too remote to mention.',counter:'Material risk = risk to which reasonable person in patient position would attach significance, OR doctor aware this patient would attach significance. Subjective limb defeats remoteness.',why_it_wins:'Montgomery overruled Sidaway — consent now patient-autonomy not Bolam.',example_case:'Montgomery (1-in-9-10% shoulder dystocia risk material).'},
 {id:'W004',name:'The Section 33 Mercy',archetype:'PI claim 4+ years stale, defendant pleads strikeout',agents:['PROCEDURE','EQUITY'],move:'s.33 application — weigh prejudice to claimant of refusal vs prejudice to defendant of allowing.',authorities:['Limitation Act 1980 s.33','Cain v Francis [2008]','Davidson v Aegis Defence Services [2013] EWCA Civ 1586'],opposition_move:'Defence prejudiced — witnesses untraceable, memories faded.',counter:'Insurance preserves evidence; medical records mandatory retention 8yrs; contemporaneous documents survive — defendant cannot show real forensic prejudice.',why_it_wins:'Section 33 expressly invites broad equity; reason for delay only one factor.',example_case:'AB v Ministry of Defence [2012] UKSC 9 (s.33 principle clear).'},

 {id:'W006',name:'The CFA Lifeline',archetype:'Client cannot fund litigation — no win, no fee needed',agents:['PROCEDURE','LIBERTY'],move:'Draft compliant CFA: signed before work, base costs + success fee uplift up to 100% of base; cap on damages.',authorities:['Courts & Legal Services Act 1990 s.58','CFA Order 2013','LASPO 2012'],opposition_move:'Costs judge says CFA unenforceable — non-compliant.',counter:'Hollins v Russell [2003] EWCA Civ 718 — only material breach renders unenforceable; cure trivial defects.',why_it_wins:'CFAs survive technical errors unless integrity of agreement compromised.',example_case:'Hollins v Russell (4 conjoined appeals — most CFAs upheld).'},
 {id:'W007',name:'The Part 36 Trap',archetype:'Want costs leverage post-trial',agents:['PROCEDURE'],move:'Serve Part 36 offer just above expected award — if not beaten, costs uplift + indemnity costs.',authorities:['CPR Part 36','Lilleyman v Lilleyman [2012] EWHC 1056','OMV Petrom v Glencore Int [2017] EWCA Civ 195'],opposition_move:'Offer pitched too high — rejected, court refuses 36.17 consequences.',counter:'Withdraw and reissue lower; tactical timing — 21-day relevant period before trial window.',why_it_wins:'Part 36 is self-contained code — court has limited discretion to disapply.',example_case:'OMV v Glencore — additional amounts, enhanced interest awarded.'},
 {id:'W008',name:'The Constructive Dismissal',archetype:'Employee resigns after fundamental breach by employer',agents:['LIBERTY','EQUITY'],move:'Plead repudiatory breach under Western Excavating test — resignation in response, not delayed.',authorities:['Employment Rights Act 1996 s.95(1)(c)','Western Excavating v Sharp [1978] ICR 221','Tullett Prebon v BGC Brokers [2011] EWCA Civ 131'],opposition_move:'Affirmation — employee continued working too long.',counter:'Reasonable time to investigate / seek advice / collect evidence does not affirm; objection raised contemporaneously.',why_it_wins:'Trust & confidence implied term is fundamental — any serious breach repudiates.',example_case:'Malik v BCCI [1997] UKHL 23 (stigma damages — confirms breadth of T&C duty).'},

 {id:'W012',name:'The Direct Discrimination',archetype:'Employee less favourably treated because of protected characteristic',agents:['LIBERTY','EQUITY'],move:'EA 2010 s.13: identify protected characteristic, comparator (actual or hypothetical), less favourable treatment, causation.',authorities:['Equality Act 2010 s.13','Shamoon v RUC [2003] UKHL 11','Nagarajan v LRT [1999] ICR 877'],opposition_move:'Treatment for legitimate reason unconnected to characteristic.',counter:'Reverse burden under s.136: once prima facie case, employer must prove non-discriminatory reason; speculation insufficient.',why_it_wins:'Burden shifting captures unconscious bias and post-hoc rationalisation.',example_case:'Igen v Wong [2005] EWCA Civ 142 — burden shifting framework.'},
 {id:'W013',name:'The Without Prejudice Veil',archetype:'Opposing party tries to put settlement communications in evidence',agents:['PROCEDURE'],move:'Object — WP communications inadmissible to prove liability.',authorities:['Cutts v Head [1984] Ch 290','Unilever v P&G [2000] 1 WLR 2436','Oceanbulk Shipping v TMT [2010] UKSC 44'],opposition_move:'Argue exception: unambiguous impropriety / threat / rectification.',counter:'Exceptions narrow — Unilever lists them; impropriety must be unequivocal; mere robust negotiation not enough.',why_it_wins:'Public policy favouring settlement is bedrock.',example_case:'Unilever (defining exceptions).'},

async function sha256(s){const buf=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}

function daysUntil(iso){if(!iso)return null;const d=new Date(iso);const n=new Date();n.setHours(0,0,0,0);d.setHours(0,0,0,0);return Math.round((d-n)/86400000)}

let db;
function openDB(){return new Promise((res)=>{
 try{
 const r=indexedDB.open(STORE,DB_VERSION);
 r.onupgradeneeded=e=>{const d=e.target.result;for(const s of STORES){if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='settings'?undefined:'id'})}};
 r.onsuccess=e=>{db=e.target.result;res(db)};
 r.onerror=()=>{db=null;res(null)};
 }catch(e){db=null;res(null)}
})}
function idbPut(store,rec,key){return new Promise((res)=>{
 if(!db){lsPut(store,rec,key);return res()}
 try{const tx=db.transaction(store,'readwrite');const s=tx.objectStore(store);key?s.put(rec,key):s.put(rec);
 tx.oncomplete=()=>res();tx.onerror=()=>{lsPut(store,rec,key);res()};
 }catch(e){lsPut(store,rec,key);res()}
})}
function idbGet(store,key){return new Promise((res)=>{
 if(!db){return res(lsGet(store,key))}
 try{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).get(key);
 req.onsuccess=()=>res(req.result);req.onerror=()=>res(lsGet(store,key));
 }catch(e){res(lsGet(store,key))}
})}
function idbAll(store){return new Promise((res)=>{
 if(!db){return res(lsAll(store))}
 try{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).getAll();
 req.onsuccess=()=>res(req.result||[]);req.onerror=()=>res(lsAll(store));
 }catch(e){res(lsAll(store))}
})}
function idbDel(store,key){return new Promise((res)=>{
 if(!db){lsDel(store,key);return res()}
 try{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);
 tx.oncomplete=()=>res();tx.onerror=()=>{lsDel(store,key);res()};
 }catch(e){lsDel(store,key);res()}
})}
const LSKEY=k=>STORE+'::'+k;
function lsPut(s,r,k){try{const all=JSON.parse(localStorage.getItem(LSKEY(s))||'{}');all[k||r.id]=r;localStorage.setItem(LSKEY(s),JSON.stringify(all))}catch(e){}}
function lsGet(s,k){try{const all=JSON.parse(localStorage.getItem(LSKEY(s))||'{}');return all[k]}catch(e){return null}}
function lsAll(s){try{return Object.values(JSON.parse(localStorage.getItem(LSKEY(s))||'{}'))}catch(e){return[]}}
function lsDel(s,k){try{const all=JSON.parse(localStorage.getItem(LSKEY(s))||'{}');delete all[k];localStorage.setItem(LSKEY(s),JSON.stringify(all))}catch(e){}}

async function handleMesh(m){
 if(!m||m.source===TOOLNAME)return;
 try{
 if(m.type==='sync.request'){
 broadcast('sync.snapshot',{clients:state.clients,advisers:state.advisers,firm:state.firm,matters:state.matters});
 }else if(m.type==='sync.snapshot'){
 const p=m.payload||{};
 if(p.firm&&(!state.firm||(p.firm.updatedAt||0)>(state.firm.updatedAt||0))){state.firm=p.firm;await idbPut('firms',p.firm)}
 for(const a of(p.advisers||[])){const local=state.advisers.find(x=>x.id===a.id);if(!local||(a.updatedAt||0)>(local.updatedAt||0)){await saveAdviser(a,'sync from '+m.source,true)}}
 for(const c of(p.clients||[])){const local=state.clients.find(x=>x.id===c.id);if(!local||(c.updatedAt||0)>(local.updatedAt||0)){await saveClient(c,'sync from '+m.source,true)}}
 for(const mt of(p.matters||[])){const local=state.matters.find(x=>x.id===mt.id);if(!local||(mt.updatedAt||0)>(local.updatedAt||0)){await saveMatter(mt,'sync from '+m.source,true)}}
 render();
 }else if(m.type==='client.created'||m.type==='client.updated'){
 const c=m.payload;if(!c||!c.id)return;
 const local=state.clients.find(x=>x.id===c.id);
 if(!local||(c.updatedAt||0)>(local.updatedAt||0)){await saveClient(c,'mesh '+m.type+' from '+m.source,true);render()}
 }else if(m.type==='matter.created'||m.type==='matter.updated'){
 const mt=m.payload;if(!mt||!mt.id)return;
 const local=state.matters.find(x=>x.id===mt.id);
 if(!local||(mt.updatedAt||0)>(local.updatedAt||0)){await saveMatter(mt,'mesh '+m.type+' from '+m.source,true);render()}
 }else if(m.type==='adviser.created'||m.type==='adviser.updated'){
 const a=m.payload;if(!a||!a.id)return;
 const local=state.advisers.find(x=>x.id===a.id);
 if(!local||(a.updatedAt||0)>(local.updatedAt||0)){await saveAdviser(a,'mesh '+m.type+' from '+m.source,true);render()}
 }else if(m.type==='firm.updated'){
 const f=m.payload;if(!f)return;
 if(!state.firm||(f.updatedAt||0)>(state.firm.updatedAt||0)){state.firm=f;await idbPut('firms',f);render()}
 }else if(m.type==='conflict.check.request'){
 const hits=scanConflicts(m.payload||{});
 broadcast('conflict.check.response',{requestId:m.payload&&m.payload.requestId,hits,source:TOOLNAME});
 }
 }catch(e){console.warn('mesh handler',e)}
}
function initMesh(){
 try{chLaw=new BroadcastChannel('fall-law');chLaw.addEventListener('message',e=>handleMesh(e.data));setTimeout(()=>broadcast('sync.request',{}),350)}catch(e){}
 try{chSignal=new BroadcastChannel('fall-signal');chSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:Date.now()});chSignal.addEventListener('message',async e=>{const m=e.data;if(!m)return;if(m.type==='ping')chSignal.postMessage({source:TOOLNAME,type:'pong',prime:PRIME})})}catch(e){}
}

function scanConflicts(q){
 const hits=[];
 const name=(q.clientName||'').toLowerCase().trim();
 const email=(q.clientEmail||'').toLowerCase().trim();
 const opp=(q.partyOpposing||'').toLowerCase().trim();
 for(const c of state.clients){
 const cn=([c.firstName,c.lastName].filter(Boolean).join(' ')||'').toLowerCase();
 if(name&&cn&&cn.includes(name))hits.push({type:'existing-client-name-match',clientId:c.id,name:cn});
 if(email&&c.email&&c.email.toLowerCase()===email)hits.push({type:'existing-client-email-match',clientId:c.id,email:c.email});
 if(opp&&cn&&cn.includes(opp))hits.push({type:'we-acted-for-opposing-party',clientId:c.id,name:cn});
 }
 for(const m of state.matters){
 if(opp&&m.partyOpposing&&m.partyOpposing.toLowerCase().includes(opp))hits.push({type:'opposing-party-match',matterId:m.id,party:m.partyOpposing});
 }
 return hits;
}

async function submitAdviser(){

async function issueAdvice(matterId){
 const m=state.matters.find(x=>x.id===matterId);if(!m)return;
 const txt=$('#advText').value.trim();if(!txt){toast('write an opinion first');return}
 const adviserId=state.settings.currentAdviserId||'';const ts=Date.now();
 const sig=await sha256(matterId+adviserId+ts+txt);
 const a={id:'adv_'+uid(),matterId,clientId:m.clientId,adviserId,ts,text:txt,signature:sig};
 await saveAdvice(a);broadcast('advice.issued',a);toast('opinion signed and retained');$('#advText').value='';render();
}

async function runConflictCheck(matterId){
 const m=state.matters.find(x=>x.id===matterId);if(!m)return;
 const cl=matterClient(m);
 const hits=scanConflicts({clientName:cl?[cl.firstName,cl.lastName].filter(Boolean).join(' '):'',clientEmail:cl?cl.email:'',partyOpposing:m.partyOpposing});
 const reqId='req_'+uid();
 broadcast('conflict.check.request',{requestId:reqId,clientName:cl?[cl.firstName,cl.lastName].filter(Boolean).join(' '):'',clientEmail:cl?cl.email:'',partyOpposing:m.partyOpposing});
 m.conflictCheckedAt=Date.now();m.conflictCheckedBy=state.settings.currentAdviserId;
 m.conflictStatus=hits.length?'conflict-identified':'clear';
 m.conflictNotes=(m.conflictNotes||'')+'\n['+dateStr(Date.now())+'] Local scan: '+hits.length+' hits.';
 await saveMatter(m,'conflict scan run');
 const el=$('#conflictResult');if(el)el.innerHTML='<div style="margin-top:12px;padding:10px;background:var(--ink);border-radius:3px"><strong style="color:var(--brass)">Local scan result:</strong> '+hits.length+' hits<br>'+(hits.length?'<pre style="font-size:11px;color:var(--cream-dim);margin-top:6px">'+esc(JSON.stringify(hits,null,2))+'</pre>':'<span style="color:var(--green)">no conflicts found in local IDB</span>')+'</div>';
 toast('scan complete: '+hits.length+' hits');
}

function askChip(el){const q=el.getAttribute('data-q');ask(q)}
function ask(q){
 const txt=q||$('#qInput').value.trim();if(!txt)return;
 state.chat.push({role:'user',text:txt,ts:Date.now()});
 const ans=answerT0(txt);
 state.chat.push({role:'bot',text:ans,ts:Date.now()});
 saveMeta();render();const ip=$('#qInput');if(ip&&!q)ip.value='';
}
function answerT0(q){
 const ql=q.toLowerCase();
 const direct=T0_RULES.find(r=>{const k=r.q.toLowerCase().replace(/[?]/g,'').split(/\s+/).filter(w=>w.length>3);return k.some(w=>ql.includes(w))});
 let ans=direct?direct.a:'';
 const matched=WEAVES.filter(w=>{const t=(w.name+' '+w.archetype+' '+w.move+' '+w.authorities.join(' ')).toLowerCase();return ql.split(/\s+/).filter(x=>x.length>3).some(x=>t.includes(x))}).slice(0,3);
 if(!ans&&!matched.length)ans='[T0 offline] No direct rule matched. Try one of the 14 quick chips, or use T3 cloud cascade for nuanced research. Always verify against primary sources (legislation.gov.uk, BAILII).';
 if(matched.length)ans+=(ans?'\n\n':'')+'Relevant weaves:\n'+matched.map(w=>'• '+w.name+' ('+w.id+') — '+w.archetype).join('\n');
 ans+='\n\n— FallLegal T0 · informational, verify against primary sources.';
 return ans;
}
async function askT3(){
 const txt=$('#qInput').value.trim();if(!txt){toast('type a question first');return}
 const m=activeMatter();const cl=m?matterClient(m):null;
 const ctx=m?`\nActive matter: ${m.ref} — ${m.title} (${m.practiceArea}). Client: ${cl?clientLabel(cl):'—'}.`:'';
 state.chat.push({role:'user',text:txt,ts:Date.now()});saveMeta();render();
 const sys='You are a UK legal research assistant for SRA-regulated solicitors. Cite statutes (s.) and cases [neutral citation]. State sources. Never provide regulated legal advice — research only. Always say "verify against primary sources".';
 const userMsg=txt+ctx;
 let answer='';
 try{
 if(state.settings.anthropicKey)answer=await callAnthropic(sys,userMsg);
 else if(state.settings.openaiKey)answer=await callOpenAI(sys,userMsg);
 else if(state.settings.geminiKey)answer=await callGemini(sys,userMsg);
 else if(state.settings.openrouterKey)answer=await callOpenRouter(sys,userMsg);
 else answer='[T3] No BYOK API key configured. Add one in Firm → Settings.'
 }catch(e){answer='[T3 error] '+e.message}
 state.chat.push({role:'bot',text:answer+'\n\n— FallLegal T3 · BYOK · verify against primary sources.',ts:Date.now()});saveMeta();render();$('#qInput').value='';
}
async function callAnthropic(sys,user){
 const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':state.settings.anthropicKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-3-5-sonnet-20241022',max_tokens:1500,system:sys,messages:[{role:'user',content:user}]})});
 const j=await r.json();if(j.error)throw new Error(j.error.message);return j.content[0].text;
}
async function callOpenAI(sys,user){
 const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+state.settings.openaiKey},body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'system',content:sys},{role:'user',content:user}],max_tokens:1500})});
 const j=await r.json();if(j.error)throw new Error(j.error.message);return j.choices[0].message.content;
}
async function callGemini(sys,user){
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+state.settings.geminiKey,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:sys+'\n\n'+user}]}]})});
 const j=await r.json();if(j.error)throw new Error(j.error.message);return j.candidates[0].content.parts[0].text;
}
async function callOpenRouter(sys,user){
 const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+state.settings.openrouterKey},body:JSON.stringify({model:'anthropic/claude-3.5-sonnet',messages:[{role:'system',content:sys},{role:'user',content:user}],max_tokens:1500})});
 const j=await r.json();if(j.error)throw new Error(j.error.message);return j.choices[0].message.content;
}

async function purgeDemo(){
 const dM=state.matters.filter(m=>m.demo);const dC=state.clients.filter(c=>c._demo);
 for(const m of dM){await idbDel('matters',m.id)}for(const c of dC){await idbDel('clients',c.id)}
 state.matters=state.matters.filter(m=>!m.demo);state.clients=state.clients.filter(c=>!c._demo);
 if(state.activeMatterId&&!state.matters.find(m=>m.id===state.activeMatterId))state.activeMatterId=null;
 await audit('demo.purged','Demo data removed',{matters:dM.length,clients:dC.length});toast('demo purged');render();
}

// ════════════════════════════════════════════════════════════════
// THE GATED AUDIT CHAIN — inlined verbatim by build-page.mjs: the shared kernel from fallhardened
// plus this repo's own byte layout.
//
// ⚑ SCOPED IN A CLOSURE. The kernel exports names the app also uses; left at top level a later
// declaration would silently win and every call site would be passing the wrong arguments to a
// function that still looked right.
// Do not edit between the markers: edit audit.mjs, re-run the gate, rebuild the page.
// ════════════════════════════════════════════════════════════════
const AUDITCHAIN=(function(){
/* __AUDIT_KERNEL__ */
// audit-chain.mjs — a tamper-evident log that can actually be checked.
//
// ⚑ WHY THIS EXISTS. Nine tools in this estate write a hash-linked audit log — clinic, vet, HR,
// recruitment, claims, legal, insurance, books, practice — and not one of them ever re-walked it.
// prevHash and docHash were written on every action and never read back, so the tamper-evidence was
// a claim about the data rather than a property of it. A regulator asking "prove this was not edited"
// would have been handed a log that could not answer.
//
// ⚑ AND WHY IT IS A FACTORY. The bug underneath the bug is that a writer and a verifier can disagree
// about WHICH BYTES were signed, and then a check passes that should not — or fails when nothing is
// wrong. Here both come out of one call and close over the same `payloadOf`, so they cannot drift.
// You cannot construct a verifier for one layout and a writer for another by accident.
//
// The byte layout itself is deliberately NOT fixed: the nine tools each sign different fields, and
// forcing one shape would either break their existing logs or quietly re-define what was signed.

/** The hash a chain starts from. An empty string, so the first entry has nothing behind it. */
const GENESIS = '';

const isFn = (f) => typeof f === 'function';

/**
 * Build a chain that can write and check its own entries.
 *
 * @param opts.sha256    async (string) => hex digest. Injected so this stays pure and testable.
 * @param opts.payloadOf (prevHash, entry, index) => string — exactly the bytes that get signed.
 *                   May return a promise: one tool in this estate hashes the payload first and signs
 *                   THAT, so the layout itself needs to await a digest.
 * @param opts.hashField which field on an entry holds the chain hash. Default "docHash". One tool
 *                   keeps two hashes — a docHash over the payload and a separate `hash` for the
 *                   link — so the field cannot be assumed.
 */
function auditChain(opts) {
  // A default parameter does not fire on an explicit null, and null is what a caller reading a
  // missing config hands you. Normalise, then read.
  const o = (opts && typeof opts === 'object') ? opts : {};
  const sha256 = o.sha256;
  const payloadOf = o.payloadOf;
  const hashField = (typeof o.hashField === 'string' && o.hashField) ? o.hashField : 'docHash';
  // ⚑ NOT EVERY CHAIN STARTS AT THE EMPTY STRING. One tool in this estate opens its log with 64
  // zeros. Assuming genesis would make its very first entry fail to verify, for ever.
  const genesis = (typeof o.genesis === 'string') ? o.genesis : GENESIS;
  if (!isFn(sha256)) throw new Error('auditChain needs a sha256(string) function');
  if (!isFn(payloadOf)) throw new Error('auditChain needs a payloadOf(prevHash, entry, index) function');

  /**
   * The hash the next entry must link to.
   *
   * The last row is read defensively because a corrupt log is exactly when this gets called: a null
   * or non-object at the end used to throw here, which turned "your audit log has a bad row" into
   * "the app crashed while trying to write an audit entry".
   */
  function headOf(entries) {
    const log = Array.isArray(entries) ? entries : [];
    if (!log.length) return genesis;
    const last = log[log.length - 1];
    if (!last || typeof last !== 'object') return genesis;
    return String(last[hashField] ?? '');
  }

  /**
   * Seal an entry onto the end of the log. Returns a NEW entry carrying prevHash and docHash —
   * it does not mutate what it was given, because an audit writer that edits its input is the
   * first thing anyone should distrust.
   */
  async function append(entries, entry) {
    const log = Array.isArray(entries) ? entries : [];
    const prevHash = headOf(log);
    // ⚑ RESPECT THE CALLER'S NUMBERING. These tools number entries from 1 and SIGN that number.
    // Overwriting it with a zero-based position would renumber every new entry and quietly change
    // what gets hashed.
    const given = (entry && typeof entry === 'object') ? entry.i : undefined;
    const i = Number.isFinite(given) ? given : log.length;
    const base = { ...(entry && typeof entry === 'object' ? entry : {}), i, prevHash };
    // ⚑ THE THIRD ARGUMENT IS THE POSITION IN THE LOG, NOT THE ENTRY'S OWN NUMBER. verify() walks the
    // array and passes the array index, so append must pass the same thing or a one-based log signs
    // one value and verifies against another — every entry written would fail its own check.
    // A layout that wants the entry's number reads it off the entry, where it lives.
    const pos = log.length;
    // await, because a layout may itself need to hash something before it can say what is signed.
    const digest = await sha256(await payloadOf(prevHash, base, pos));
    return { ...base, [hashField]: digest };
  }

  /**
   * Walk the log and report the FIRST entry that does not reproduce. The earliest break is when the
   * tampering happened; everything after it is just that break's wake, so reporting later ones would
   * bury the answer.
   *
   * `expectHead` is optional and closes the one hole a chain cannot close on its own — see below.
   */
  async function verify(entries, checkOpts) {
    const log = Array.isArray(entries) ? entries : [];
    const c = (checkOpts && typeof checkOpts === 'object') ? checkOpts : {};
    let prev = genesis;

    for (let i = 0; i < log.length; i++) {
      const e = (log[i] && typeof log[i] === 'object') ? log[i] : {};
      if (String(e.prevHash ?? '') !== prev) {
        return { ok: false, brokeAt: i, id: e.id ?? null, entries: log.length,
                 reason: 'this entry does not link to the one before it — something was inserted, removed or reordered' };
      }
      const expected = await sha256(await payloadOf(prev, e, i));
      if (expected !== e[hashField]) {
        return { ok: false, brokeAt: i, id: e.id ?? null, entries: log.length,
                 reason: 'this entry was altered after it was written' };
      }
      prev = e[hashField];
    }

    // ⚑ THE HONEST BOUND. A chain proves nothing was changed or removed from the MIDDLE. Delete the
    // last few entries and what remains is a perfectly valid chain — the log simply looks shorter.
    // The only defence is knowing what the head should be, from somewhere the editor could not reach.
    // Without expectHead this returns ok:true and SAYS the tail is unproven, rather than implying a
    // completeness it cannot demonstrate.
    if (c.expectHead != null) {
      if (String(c.expectHead) !== prev) {
        return { ok: false, brokeAt: log.length, id: null, entries: log.length,
                 reason: 'the log ends earlier than it should — entries were removed from the end' };
      }
      return { ok: true, entries: log.length, tailProven: true,
               reason: 'every entry reproduces its own hash, and the log ends where it was expected to' };
    }

    return {
      ok: true, entries: log.length, tailProven: false,
      reason: log.length
        ? 'every entry reproduces its own hash — but nothing here can prove entries were not removed from the END; keep the head hash somewhere separate to close that'
        : 'the log is empty',
    };
  }

  return { append, verify, headOf, payloadOf };
}


// audit.mjs — falllegal's audit layout, and the chain built from it.
//
// ⚑ THE BYTES MUST NOT CHANGE. There are logs in the wild signed by the old inline writer. If this
// layout differs by one character, every entry a firm has already written stops reproducing and the
// verifier reports its whole history as tampered. Making a real audit trail look forged is a worse
// outcome than not checking it at all, so this is a faithful copy and audit.test.mjs pins it against
// the original formula.
//
// The chain semantics live in the shared, separately-gated audit-chain kernel. Only the byte layout
// is this repo's business.

function payloadOf(prevHash, entry) {
  const e = (entry && typeof entry === 'object') ? entry : {};
  return String(prevHash == null ? '' : prevHash)
    + String(e.ts ?? '') + String(e.action ?? '')
    + String(e.adviserId ?? '') + String(e.clientId ?? '') + String(e.matterId ?? '')
    + JSON.stringify(e.payload ?? {});
}

/** The writer and the checker, from one call, over one layout — so they cannot drift apart. */
function makeAuditChain(sha256) {
  return auditChain({
    sha256,
    payloadOf: payloadOf,
    hashField: "docHash",
  });
}


/* __END_AUDIT_KERNEL__ */
return makeAuditChain(sha256);
})();
